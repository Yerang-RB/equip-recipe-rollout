spring.application.name=equip-recipe-rollout

# 로컬 스크립트 실행은 루프백에만 바인드한다(불변 조건 16 — 컨테이너 안에서는 compose가 0.0.0.0을 준다).
server.address=127.0.0.1

# 본문 경로는 JSON 하나다. 멀티파트·폼 필터는 본문 상한 스트림 밖의 읽기 경로라 닫는다(불변 조건 4).
spring.servlet.multipart.enabled=false
spring.mvc.formcontent.filter.enabled=false

# 계약(additionalProperties: false)대로 미지 필드를 담은 요청 본문을 거부한다(기본값은 조용히 버린다).
spring.jackson.deserialization.fail-on-unknown-properties=true

# 구조화 JSON 로깅은 Boot 내장 기능이다(불변 조건 11) — 테스트도 이 형식의 줄을 읽는다.
logging.structured.format.console=logstash

# 운영이 보는 둘만 연다(불변 조건 2 — 워커의 HTTP는 이 둘뿐이다).
management.endpoints.web.exposure.include=health,prometheus

# 워커 기본값(불변 조건 5·8·11). 값은 작업 6의 ConfigPinTest가 핀으로 못박는다.
worker.lease-seconds=120
worker.heartbeat-seconds=30
worker.browser-concurrency=3
worker.claim-parallelism=6
worker.max-attempts=3
worker.backoff-base-seconds=2
worker.backoff-max-seconds=60
worker.loop-stale-seconds=60

# 세션 쿠키 속성(불변 조건 3). Boot 기본값과 같은 값이지만 명시한다 —
# AuthApiTest는 실포트의 실제 Set-Cookie 헤더에서 HttpOnly·SameSite=Lax를 읽는다.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# WebSocket 핸드셰이크의 허용 Origin은 하나뿐이다(불변 조건 16).
app.web-origin=${APP_WEB_ORIGIN:http://localhost:3000}

# REST 계약 정본(불변 조건 1). 엔드포인트·상태코드를 늘리려면 여기를 먼저 고친다.
# 테스트가 이 파일에서 (경로, 메서드) 집합을 읽어 인가 매트릭스·무인증 401·감사 쓰기 오퍼레이션 전수를 만든다.
# `security: []`인 오퍼레이션이 무인증 허용이고, 그 밖의 모든 오퍼레이션은 401·403을 선언한다.
openapi: 3.1.0
info:
  title: 설비 레시피 일괄 배포 API
  version: "1.0.0"
  description: 세션 쿠키 인증. 역할은 OPERATOR·APPROVER·ADMIN 셋이고 권한은 설계 §8 매트릭스가 정본이다.

security:
  - sessionCookie: []

paths:
  /api/health:
    get:
      summary: 헬스(스모크 앵커)
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status: { type: string }

  /api/auth/login:
    post:
      summary: 로그인(실패는 존재를 숨기는 동일 401)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/auth/logout:
    post:
      summary: 로그아웃(세션 폐기)
      responses:
        "204": { description: 폐기됨 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/me:
    get:
      summary: 현재 사용자
      responses:
        "200":
          description: 현재 사용자
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/users:
    get:
      summary: 사용자 목록(ADMIN)
      responses:
        "200":
          description: 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: 사용자 등록(ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreateRequest" }
      responses:
        "201":
          description: 등록됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      summary: 사용자 수정(ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdateRequest" }
      responses:
        "200":
          description: 수정됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/equipment:
    get:
      summary: 설비 목록(상태·마지막 적용 레시피 — 콘솔 자격증명은 응답에 없다)
      responses:
        "200":
          description: 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Equipment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: 설비 등록(ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EquipmentCreateRequest" }
      responses:
        "201":
          description: 등록됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Equipment" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/equipment/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      summary: 설비 수정(ADMIN — 콘솔 자격증명 포함, 응답에는 없다)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EquipmentUpdateRequest" }
      responses:
        "200":
          description: 수정됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Equipment" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/recipes:
    get:
      summary: 레시피 목록
      responses:
        "200":
          description: 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Recipe" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: 레시피 초안 생성(OPERATOR·APPROVER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeRequest" }
      responses:
        "201":
          description: 생성됨(DRAFT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/recipes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 레시피 상세
      responses:
        "200":
          description: 상세
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: 레시피 초안 수정(DRAFT만)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeRequest" }
      responses:
        "200":
          description: 수정됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/recipes/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: 레시피 승인(APPROVER · 자기가 만든 것은 불가)
      responses:
        "200":
          description: ACTIVE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/recipes/{id}/retire:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: 레시피 폐기(APPROVER)
      responses:
        "200":
          description: RETIRED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/jobs:
    get:
      summary: 잡 목록
      responses:
        "200":
          description: 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: 배포 잡 생성(ACTIVE 레시피만 · Idempotency-Key 필수 · 같은 키면 200으로 기존 잡)
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobRequest" }
      responses:
        "200":
          description: 같은 키의 기존 잡
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "201":
          description: 생성됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/jobs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 잡 상세(task 포함)
      responses:
        "200":
          description: 상세
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/jobs/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: 잡 취소(OPERATOR는 자기 잡만 · 실행 중 task는 끝까지 간다)
      responses:
        "200":
          description: 취소 반영
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/jobs/{id}/retry:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      summary: 잡 재시도(실패·취소 task를 PENDING으로)
      responses:
        "200":
          description: 재시도 반영
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/history:
    get:
      summary: 적용 이력
      parameters:
        - { name: equipmentId, in: query, required: false, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/History" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/audit:
    get:
      summary: 감사 로그(APPROVER·ADMIN)
      responses:
        "200":
          description: 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Audit" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/ws/jobs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      summary: 잡 진행 WebSocket(세션 쿠키 핸드셰이크 · 연결 직후 현재 스냅샷 1회, 이후 진행 알림마다 스냅샷)
      responses:
        "101": { description: 업그레이드 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID

  responses:
    InvalidRequest:
      description: 검증·미지 필드·타입·파싱 실패
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: 인증 없음(리다이렉트 없이 JSON)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 권한 없음
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 대상 없음
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: 상태 전이·제약 위반
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - UNAUTHENTICATED
            - FORBIDDEN
            - SELF_APPROVAL_FORBIDDEN
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - RECIPE_NOT_ACTIVE
            - JOB_ALREADY_FINISHED
            - INVALID_TRANSITION
            - CONSTRAINT_VIOLATION
            - PAYLOAD_TOO_LARGE
            - INTERNAL_ERROR
        message: { type: string }

    Role:
      type: string
      enum: [OPERATOR, APPROVER, ADMIN]

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 50 }
        password: { type: string, minLength: 1 }

    Me:
      type: object
      additionalProperties: false
      required: [username, displayName, role]
      properties:
        username: { type: string }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    User:
      type: object
      additionalProperties: false
      required: [id, username, displayName, role, enabled]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        enabled: { type: boolean }

    UserCreateRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, role, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 50 }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        role: { $ref: "#/components/schemas/Role" }
        password: { type: string, minLength: 1 }

    UserUpdateRequest:
      type: object
      additionalProperties: false
      required: [displayName, role, enabled]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        role: { $ref: "#/components/schemas/Role" }
        enabled: { type: boolean }
        password: { type: [string, "null"], minLength: 1 }

    Equipment:
      type: object
      additionalProperties: false
      required: [id, code, consoleUrl, model, status]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        consoleUrl: { type: string }
        model: { type: string }
        status: { type: string, enum: [RUNNING, STOPPED, MAINTENANCE] }
        lastApplied: { type: [string, "null"] }

    EquipmentCreateRequest:
      type: object
      additionalProperties: false
      required: [code, consoleUrl, model, status, consoleUser, consolePassword]
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        consoleUrl: { type: string, minLength: 1, maxLength: 500, pattern: '^https?://' }
        model: { type: string, minLength: 1, maxLength: 100 }
        status: { type: string, enum: [RUNNING, STOPPED, MAINTENANCE] }
        consoleUser: { type: string, minLength: 1, maxLength: 100 }
        consolePassword: { type: string, minLength: 1, maxLength: 200 }

    EquipmentUpdateRequest:
      description: consoleUrl을 바꾸면 consolePassword도 함께 준다(없으면 400) — 저장된 비밀번호가 새 호스트로 가지 않게.
      type: object
      additionalProperties: false
      required: [consoleUrl, model, status, consoleUser]
      properties:
        consoleUrl: { type: string, minLength: 1, maxLength: 500, pattern: '^https?://' }
        model: { type: string, minLength: 1, maxLength: 100 }
        status: { type: string, enum: [RUNNING, STOPPED, MAINTENANCE] }
        consoleUser: { type: string, minLength: 1, maxLength: 100 }
        consolePassword: { type: [string, "null"], maxLength: 200 }

    Recipe:
      type: object
      additionalProperties: false
      required: [id, partNo, version, status, params, createdBy]
      properties:
        id: { type: integer, format: int64 }
        partNo: { type: string }
        version: { type: integer }
        status: { type: string, enum: [DRAFT, ACTIVE, RETIRED] }
        params:
          type: object
          additionalProperties: { type: string }
        createdBy: { type: integer, format: int64 }
        approvedBy: { type: [integer, "null"], format: int64 }
        createdAt: { type: string }

    RecipeRequest:
      type: object
      additionalProperties: false
      required: [partNo, version, params]
      properties:
        partNo: { type: string, minLength: 1, maxLength: 50 }
        version: { type: integer, minimum: 1 }
        params:
          type: object
          propertyNames: { pattern: '^[a-z][a-z0-9_]{0,49}$' }
          additionalProperties: { type: string }

    Task:
      type: object
      additionalProperties: false
      required: [id, equipmentId, equipmentCode, status, attempt]
      properties:
        id: { type: integer, format: int64 }
        equipmentId: { type: integer, format: int64 }
        equipmentCode: { type: string }
        status: { type: string, enum: [PENDING, CLAIMED, SUCCEEDED, FAILED, CANCELLED] }
        attempt: { type: integer }
        lastError: { type: [string, "null"] }

    Job:
      type: object
      additionalProperties: false
      required: [id, recipeId, status, requestedBy]
      properties:
        id: { type: integer, format: int64 }
        recipeId: { type: integer, format: int64 }
        partNo: { type: string }
        version: { type: integer }
        status: { type: string, enum: [PENDING, RUNNING, SUCCEEDED, PARTIAL, FAILED] }
        requestedBy: { type: integer, format: int64 }
        createdAt: { type: string }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/Task" }

    JobRequest:
      type: object
      additionalProperties: false
      required: [recipeId, equipmentIds]
      properties:
        recipeId: { type: integer, format: int64 }
        equipmentIds:
          type: array
          minItems: 1
          items: { type: integer, format: int64 }

    History:
      type: object
      additionalProperties: false
      required: [id, equipmentId, equipmentCode, partNo, version, result, appliedAt, appliedBy]
      properties:
        id: { type: integer, format: int64 }
        equipmentId: { type: integer, format: int64 }
        equipmentCode: { type: string }
        partNo: { type: string }
        version: { type: integer }
        result: { type: string, enum: [APPLIED, NO_CHANGE] }
        appliedAt: { type: string }
        appliedBy: { type: integer, format: int64 }
        params:
          type: object
          additionalProperties: { type: string }

    Audit:
      type: object
      additionalProperties: false
      required: [id, at, actorName, action, targetType, result]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string }
        actorId: { type: [integer, "null"], format: int64 }
        actorName: { type: string }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: [integer, "null"], format: int64 }
        result: { type: string, enum: [OK, DENIED, ERROR] }
        detail:
          type: object
          additionalProperties: true
